<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090807"><title>ORZU — Ofitsiant</title><link rel="manifest" href="/waiter-manifest.webmanifest"><link rel="icon" href="/waiter-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
<style>
:root{--g:#f4c65e;--g2:#ffe39a;--muted:#c0b5a3}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% -15%,#523315 0,#17100a 40%,#080706 80%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.hero{text-align:center;padding:18px 12px 15px}.hero .crown{font-size:38px;color:var(--g2)}.hero h1{font: bold 39px Georgia,serif;letter-spacing:3px;color:var(--g2);margin:0}.hero p{font-size:11px;letter-spacing:5px;color:#fff0c9;margin:0}.wrap{max-width:650px;margin:auto;padding:0 12px 25px}.profile,.stat,.order{background:linear-gradient(120deg,#291b10,#110d09 80%);border:1px solid #8a642c;border-radius:18px;box-shadow:0 7px 23px #0008}.profile{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:13px}.avatar{width:62px;height:62px;border-radius:50%;border:2px solid var(--g);display:grid;place-items:center;font-size:30px;background:#302012}.profile b{font-size:16px}.profile small{display:block;color:#c0b5a3;margin-top:4px}.online{color:#54e56c;font-size:12px;margin-top:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{padding:13px;text-align:center}.stat span{font-size:13px;color:#eee}.stat b{display:block;color:var(--g2);font-size:21px;margin-top:6px}.newbtn{width:100%;border:0;border-radius:17px;padding:17px;background:linear-gradient(110deg,#ffe18d,#d58e20);color:#241606;font-size:17px;font-weight:900;margin:6px 0 17px;box-shadow:0 5px 18px #bd7c1d55}.section-title{display:flex;align-items:center;justify-content:space-between;margin:15px 3px 10px}.section-title h2{font-size:18px;margin:0}.order{padding:13px;margin:10px 0;border-radius:17px}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.oid{font-weight:800;color:var(--g2)}.time{font-size:12px;color:#c7bba9}.items{font-size:14px;line-height:1.6;color:#e4ddd2;margin:10px 0}.status{border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800;background:#70252b}.status.accepted{background:#174e8b}.status.served{background:#95500b}.status.paid{background:#1c642b}.actions{display:flex;gap:8px}.actions button,.btn{border:1px solid #f5d47f;background:linear-gradient(110deg,#ffe18d,#d58e20);color:#201405;border-radius:11px;padding:10px 12px;font-weight:800}.actions .dark{background:#25190e;color:#ffdc8c;border-color:#8a642c}.empty{text-align:center;color:#c0b5a3;padding:22px}.login{max-width:400px;margin:20px auto;padding:18px;background:#21170f;border:1px solid #8a642c;border-radius:18px}.login input,.login select,.input{width:100%;padding:14px;border:1px solid #8a642c;background:#0b0907;color:white;border-radius:11px;margin:8px 0;font-size:16px}.sound{width:100%;background:#24190e;color:#ffdc8c;border:1px solid #8a642c;margin:0 0 12px}.modal{position:fixed;inset:0;background:#090807f5;z-index:99;overflow:auto;padding:16px}.modalbox{max-width:480px;margin:auto}.menuitem{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid #5c4524}.qty button{background:#3b2a16;color:#ffe18d;border:1px solid #8a642c;border-radius:8px;padding:5px 11px}.muted{color:#c0b5a3;font-size:13px}
</style></head><body>
<header class="hero"><div class="crown">♛</div><h1>ORZU</h1><p>R E S T O R A N I</p></header><main class="wrap" id="app"></main>
<script>
let W=JSON.parse(localStorage.w||'null'),O=[],knownNewIds=new Set(),firstOrdersLoad=true,soundContext=null,MENU=[],SEL={},TGT=0;
const f=n=>Number(n||0).toLocaleString('uz-UZ')+" so'm",esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={new:'Yangi buyurtma',accepted:'Qabul qilindi',served:'Tayyorlanmoqda',paid:'Yakunlandi'},NX={new:['accepted','Qabul qilish'],accepted:['served','Taom berildi'],served:['paid','To‘landi']};
function unlockSound(){try{soundContext=soundContext||new AudioContext();soundContext.resume()}catch(e){}}
function login(){fetch('/api/waiters').then(r=>r.json()).then(ws=>{app.innerHTML='<section class="login"><h2 style="color:#ffe39a">Ofitsiant kirishi</h2><select id="ws">'+ws.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>').join('')+'</select><input id="pin" type="password" placeholder="PIN kod"><button class="newbtn" onclick="go()">Kirish</button><p class="muted">Kirishdan keyin yangi zakaz ovozini yoqing.</p></section>'})}
async function go(){unlockSound();W={id:ws.value,pin:pin.value};const r=await fetch('/api/waiter/orders?id='+encodeURIComponent(W.id)+'&pin='+encodeURIComponent(W.pin));if(!r.ok)return alert("PIN noto'g'ri");localStorage.w=JSON.stringify(W);knownNewIds=new Set();firstOrdersLoad=true;load()}
async function load(){if(!W)return login();const r=await fetch('/api/waiter/orders?id='+encodeURIComponent(W.id)+'&pin='+encodeURIComponent(W.pin));if(!r.ok){localStorage.removeItem('w');W=null;return login()}O=await r.json();const fresh=O.filter(o=>o.status==='new'&&!firstOrdersLoad&&!knownNewIds.has(String(o.id)));fresh.forEach(beep);knownNewIds=new Set(O.filter(o=>o.status==='new').map(o=>String(o.id)));firstOrdersLoad=false;draw()}
function beep(order){try{unlockSound();[880,1175,880].forEach((hz,i)=>{const o=soundContext.createOscillator(),g=soundContext.createGain();o.frequency.value=hz;g.gain.value=.14;o.connect(g);g.connect(soundContext.destination);o.start(soundContext.currentTime+i*.2);o.stop(soundContext.currentTime+i*.2+.16)});navigator.vibrate&&navigator.vibrate([220,100,220]);if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance('Sizga yangi buyurtma. Stol '+order.table);u.lang='uz-UZ';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
function draw(){const active=O.filter(o=>o.status!=='paid'),today=O.filter(o=>new Date(o.time).toDateString()===new Date().toDateString()),fresh=active.filter(o=>o.status==='new');app.innerHTML='<section class="profile"><div class="avatar">👨🏻‍🍳</div><div><b>'+esc(W.name||'Ofitsiant')+'</b><small>Ofitsiant</small><div class="online">● Onlayn</div></div><button class="btn" style="margin-left:auto" onclick="logout()">Chiqish</button></section><button class="btn sound" onclick="enableAlerts()">🔔 Ovozli xabarni yoqish</button><div class="stats"><div class="stat"><span>Bugungi buyurtmalar</span><b>'+today.length+'</b></div><div class="stat"><span>Bugungi tushum</span><b style="font-size:17px">'+f(today.reduce((s,o)=>s+Number(o.total||0),0))+'</b></div></div><button class="newbtn" onclick="openAdd(0)">✓　Yangi buyurtma　'+(fresh.length?'<span style="background:#bd2431;color:white;border-radius:20px;padding:3px 8px">'+fresh.length+'</span>':'')+'　›</button><div class="section-title"><h2>▤ Mening buyurtmalarim</h2><span class="muted">'+active.length+' ta faol</span></div>'+O.slice().reverse().map(card).join('')+'<div class="empty">'+(O.length?'':'Hozircha buyurtma yo‘q')+'</div>'}
function card(o){return '<article class="order"><div class="top"><span class="oid">#'+esc(o.id)+' · Stol '+esc(o.table)+'</span><span class="time">'+(o.time?new Date(o.time).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}):'')+'</span></div><div class="items">'+(o.items||[]).map(i=>esc(i.name)+' × '+esc(i.qty)).join('<br>')+'</div><div class="bottom"><span class="status '+esc(o.status)+'">'+esc(ST[o.status]||o.status)+'</span><b style="color:#ffe39a">'+f(o.total)+'</b></div>'+(o.status!=='paid'?'<div class="actions" style="margin-top:10px"><button class="dark" onclick="openAdd('+Number(o.id)+')">+ Qo‘shish</button>'+(NX[o.status]?'<button onclick="st('+Number(o.id)+',\''+NX[o.status][0]+'\')">'+NX[o.status][1]+'</button>':'')+'</div>':'')+'</article>'}
function enableAlerts(){unlockSound();if('Notification'in window)Notification.requestPermission();alert('Ovoz yoqildi. Yangi zakaz kelganda stol raqami aytiladi.')}
function logout(){localStorage.removeItem('w');W=null;knownNewIds.clear();login()}
async function st(orderId,status){await fetch('/api/waiter/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...W,orderId,status})});load()}
async function openAdd(id){unlockSound();TGT=id;SEL={};if(!MENU.length)MENU=(await(await fetch('/api/menu')).json()).menu;const o=O.find(o=>o.id==id);const d=document.createElement('div');d.id='pk';d.className='modal';d.innerHTML='<div class="modalbox"><h2 style="color:#ffe39a">'+(id?'Stol '+esc(o.table)+': qo‘shish':'Yangi buyurtma')+'</h2>'+(id?'':'<input class="input" id="tb" placeholder="Stol raqami">')+'<div id="pl"></div><div class="actions" style="margin-top:15px"><button class="dark" onclick="pk.remove()">Bekor</button><button onclick="sendAdd()">Saqlash</button></div></div>';document.body.appendChild(d);pdraw()}
function pdraw(){pl.innerHTML=MENU.length?MENU.map(m=>'<div class="menuitem"><span>'+esc(m.name)+'<br><small class="muted">'+f(m.price)+'</small></span><span class="qty"><button onclick="pq('+Number(m.id)+',-1)">−</button> <b>'+Number(SEL[m.id]||0)+'</b> <button onclick="pq('+Number(m.id)+',1)">+</button></span></div>').join(''):'<p>Menyu bo‘sh</p>'}
function pq(id,d){SEL[id]=Math.max(0,Math.min(99,(SEL[id]||0)+d));pdraw()}
async function sendAdd(){const items=Object.entries(SEL).filter(e=>e[1]>0).map(e=>({id:+e[0],qty:e[1]}));if(!items.length)return alert('Taom tanlang');const b={...W,items};if(TGT)b.orderId=TGT;else{b.table=tb.value;if(!b.table.trim())return alert('Stol raqamini kiriting')}const r=await fetch('/api/waiter/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)return alert((await r.json()).error||'Xato');pk.remove();load()}
if(W)load();else login();setInterval(()=>W&&load(),4000);
</script></body></html>
