<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orzu — Ofitsiant</title><meta name="theme-color" content="#111014"><link rel="manifest" href="/waiter-manifest.webmanifest"><link rel="icon" href="/waiter-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body>
<div class="hero" style="padding:20px"><h1 class="gold" style="font-size:34px">ORZU</h1><p>OFITSIANT PANELI</p></div>
<div class="wrap" id="app"></div>
<script>
let W=JSON.parse(localStorage.w||'null'),O=[],knownNewIds=new Set(),firstOrdersLoad=true;
const f=n=>n.toLocaleString('ru')+" so'm";
const ST={new:'Yangi',accepted:'Qabul qilindi',served:'Berildi',paid:'To‘landi'},NX={new:['accepted','Qabul qilish'],accepted:['served','Taom berildi'],served:['paid','To‘landi']};
async function login(){const ws=await(await fetch('/api/waiters')).json();
app.innerHTML=`<div class="stat" style="max-width:400px;margin:auto"><h2 class="gold">Kirish</h2><select id="ws">${ws.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select><input id="pin" type="password" placeholder="PIN kod"><button class="btn" style="width:100%;margin-top:8px" onclick="go()">Kirish</button></div>`}
async function go(){W={id:ws.value,pin:pin.value};const r=await fetch(`/api/waiter/orders?id=${W.id}&pin=${W.pin}`);if(r.status!=200)return alert("PIN noto'g'ri");localStorage.w=JSON.stringify(W);load()}
async function load(){if(!W)return login();const r=await fetch(`/api/waiter/orders?id=${W.id}&pin=${W.pin}`);if(r.status!=200){localStorage.removeItem('w');W=null;return login()}
O=await r.json();const newOrders=O.filter(o=>o.status==='new');const fresh=newOrders.filter(o=>!firstOrdersLoad&&!knownNewIds.has(String(o.id)));if(fresh.length)fresh.forEach(o=>beep(o));knownNewIds=new Set(newOrders.map(o=>String(o.id)));firstOrdersLoad=false;draw()}
function beep(order){try{const a=new AudioContext();[880,1175].forEach((hz,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=hz;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.18);o.stop(a.currentTime+i*.18+.16)});navigator.vibrate&&navigator.vibrate([220,100,220]);if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance('Yangi buyurtma. Stol '+order.table);u.lang='uz-UZ';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}}
function draw(){const act=O.filter(o=>o.status!='paid'),today=O.filter(o=>new Date(o.time).toDateString()==new Date().toDateString()).reduce((s,o)=>s+o.total,0);
app.innerHTML=`<div class="row" style="margin-bottom:14px"><div class="stat" style="flex:1"><span>Faol buyurtmalar</span><b class="gold">${act.length}</b></div><div class="stat" style="flex:1"><span>Bugungi savdo</span><b class="gold" style="font-size:18px">${f(today)}</b></div></div><button class="btn" style="width:100%;margin-bottom:14px" onclick="openAdd(0)">+ Yangi buyurtma</button>`+
(O.map((o,i)=>`<div class="card" style="margin-bottom:14px;animation-delay:${i*.04}s;opacity:${o.status=='paid'?.55:1}"><div class="p"><div class="row"><h3>Stol ${o.table}</h3><span class="badge ${o.status}">${ST[o.status]}</span></div><div style="margin:10px 0;font-size:14px;line-height:1.7">${o.items.map(i=>`${i.name} × ${i.qty}`).join('<br>')}</div><div class="row"><b class="gold">${f(o.total)}</b>${o.status!='paid'?`<button class="btn sm" style="background:#2b2b2b;color:#e9c46a" onclick="openAdd(${o.id})">+ Qo'shish</button>`:''}${NX[o.status]?`<button class="btn sm" onclick="st(${o.id},'${NX[o.status][0]}')">${NX[o.status][1]}</button>`:''}</div></div></div>`).join('')||'<p style="text-align:center;color:#b9a875">Hozircha buyurtma yo‘q</p>')+`<p style="text-align:center;margin-top:20px"><button class="btn sm red" onclick="localStorage.removeItem('w');location.reload()">Chiqish</button></p>`}
async function st(orderId,status){await fetch('/api/waiter/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...W,orderId,status})});load()}
let MENU=[],SEL={},TGT=0;
async function openAdd(id){TGT=id;SEL={};if(!MENU.length)MENU=(await(await fetch('/api/menu')).json()).menu;
const o=O.find(o=>o.id==id);
const d=document.createElement('div');d.id='pk';d.style.cssText='position:fixed;inset:0;background:#0b0b0d;z-index:99;overflow:auto;padding:16px';
d.innerHTML=`<div style="max-width:480px;margin:auto;display:block"><h2 class="gold" style="margin-bottom:12px">${id?'Stol '+o.table+': qo‘shish':'Yangi buyurtma'}</h2>${id?'':'<input id="tb" placeholder="Stol raqami">'}<div id="pl"></div><div class="row" style="margin-top:12px"><button class="btn sm red" onclick="pk.remove()">Bekor</button><button class="btn sm" onclick="sendAdd()">Saqlash</button></div></div>`;
document.body.appendChild(d);pdraw()}
function pdraw(){pl.innerHTML=MENU.length?MENU.map(m=>`<div class="row" style="margin:8px 0"><span>${m.name}<br><small style="color:#b9a875">${f(m.price)}</small></span><span class="q"><button onclick="pq(${m.id},-1)">-</button> <b style="margin:0 8px">${SEL[m.id]||0}</b> <button onclick="pq(${m.id},1)">+</button></span></div>`).join(''):'<p>Menyu bo‘sh</p>'}
function pq(id,d){SEL[id]=Math.max(0,Math.min(99,(SEL[id]||0)+d));pdraw()}
async function sendAdd(){const items=Object.entries(SEL).filter(e=>e[1]>0).map(e=>({id:+e[0],qty:e[1]}));if(!items.length)return alert('Taom tanlang');
const b={...W,items};if(TGT)b.orderId=TGT;else{b.table=tb.value;if(!b.table.trim())return alert('Stol raqamini kiriting')}
const r=await fetch('/api/waiter/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)return alert((await r.json()).error||'Xato');pk.remove();load()}
load();setInterval(()=>W&&load(),4000);
</script></body></html>
