<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111014"><title>ORZU — Administrator</title><link rel="manifest" href="/administrator-manifest.webmanifest"><link rel="icon" href="/administrator-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
<style>
body{padding-bottom:30px}.head{padding:20px;text-align:center}.head .letter{width:64px;height:64px;border-radius:18px;background:#d7b45a;color:#111014;font-size:42px;font-weight:900;display:grid;place-items:center;margin:0 auto 10px}.wrap{max-width:900px;margin:auto;padding:12px}.login,.panel,.order{background:#211e20;border:1px solid #554522;border-radius:14px;padding:16px;margin:12px 0}.gold{color:#d7b45a}.muted{color:#b9a875}.orderhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.items{padding:8px 0;border-top:1px solid #51452c;margin-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.pill{border-radius:20px;padding:4px 9px;background:#4b3d1d;color:#f2d78d;font-size:12px}.btn{cursor:pointer}
</style></head><body>
<header class="head"><div class="letter">A</div><h1 class="gold">ORZU</h1><p>ADMINISTRATOR · BARCHA BUYURTMALAR</p></header>
<main class="wrap"><section id="login" class="login"><h2 class="gold">Administrator kirishi</h2><p class="muted">Administrator uchun alohida parolni kiriting.</p><input id="pass" type="password" placeholder="Administrator paroli" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:10px" onclick="signIn()">Kirish</button><p id="err" class="muted"></p></section>
<section id="dashboard" hidden><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 class="gold">Buyurtmalar nazorati</h2><button class="btn" onclick="notifyOn()">🔔 Ovoz va bildirishnomani yoqish</button></div><p class="muted">Yangi zakazda stol va mas’ul ofitsiant ovoz bilan aytiladi.</p></div><div class="panel"><h2 class="gold">Barcha ofitsiantlar</h2><div id="waiters"></div></div><div class="panel"><h2 class="gold">Barcha zakazlar</h2><div class="muted">Yangi buyurtmalar avtomatik yangilanadi.</div><div id="orders"></div></div><button class="btn" onclick="logout()">Chiqish</button></section></main>
<script>
let key=localStorage.getItem('orzu_administrator_key')||'',known=null,loading=false;
const money=n=>Number(n||0).toLocaleString('ru')+" so'm";
async function signIn(){key=pass.value.trim();if(!key)return;localStorage.setItem('orzu_administrator_key',key);await load()}
function logout(){localStorage.removeItem('orzu_administrator_key');key='';dashboard.hidden=true;login.hidden=false}
async function api(){const r=await fetch('/api/administrator/data',{headers:{'x-administrator':key}});if(r.status===401){err.textContent='Parol noto‘g‘ri yoki ruxsat yo‘q.';logout();return null}return r.json()}
function notifyOn(){if(!('Notification'in window))return alert('Brauzer bildirishnomani qo‘llamaydi');Notification.requestPermission().then(x=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},180)}catch(e){}alert(x==='granted'?'Ovoz va bildirishnomalar yoqildi':'Bildirishnomaga ruxsat berilmadi')})}
function render(d){login.hidden=true;dashboard.hidden=false;const all=d.orders||[];
waiters.innerHTML=d.waiters.map(w=>{const a=all.filter(o=>o.waiter===w.id);return '<div style="padding:8px 0;border-bottom:1px solid #51452c"><b>'+esc(w.name)+'</b> — '+a.length+' ta zakaz · '+money(a.reduce((s,o)=>s+Number(o.total||0),0))+'</div>'}).join('')||'Ofitsiantlar yo‘q';
orders.innerHTML=all.map(o=>'<article class="order"><div class="orderhead"><b class="gold">Zakaz #'+o.id+' · Stol '+esc(o.table)+'</b><span class="pill">'+esc(o.status)+'</span></div><div class="muted">Ofitsiant: '+esc(o.waiterName||'—')+' · '+new Date(o.time).toLocaleString('uz-UZ')+'</div><div class="items">'+(o.items||[]).map(i=>'<div class="item"><span>'+esc(i.name)+' × '+i.qty+'</span><b>'+money(i.price*i.qty)+'</b></div>').join('')+'</div><b class="gold">Jami: '+money(o.total)+'</b></article>').join('')||'<p class="muted">Hozircha zakaz yo‘q.</p>';
if(known){const freshOrders=all.filter(o=>o.status==='new'&&!known.has(String(o.id)));if(freshOrders.length){try{if(Notification.permission==='granted')freshOrders.forEach(o=>new Notification('ORZU — yangi zakaz',{body:'Stol '+o.table+' · Mas’ul ofitsiant: '+o.waiterName,icon:'/administrator-icon.svg'}));const a=new AudioContext();[880,1175].forEach((hz,i)=>{const osc=a.createOscillator(),g=a.createGain();g.gain.value=.12;osc.frequency.value=hz;osc.connect(g);g.connect(a.destination);osc.start(a.currentTime+i*.18);osc.stop(a.currentTime+i*.18+.16)});navigator.vibrate&&navigator.vibrate([250,100,250]);const o=freshOrders[0],u=new SpeechSynthesisUtterance('Yangi buyurtma. Stol '+o.table+'. Ofitsiant '+o.waiterName);u.lang='uz-UZ';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}}
known=new Set(all.map(o=>String(o.id)))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!key||loading)return;loading=true;try{const d=await api();if(d)render(d)}catch(e){console.error(e)}finally{loading=false}}
if(key)load();else login.hidden=false;setInterval(load,4000);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/admin-sw.js').catch(()=>{}));
</script></body></html>
