<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090807"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Administrator"><link rel="apple-touch-icon" href="/administrator-icon.svg"><title>ORZU — Administrator</title><link rel="manifest" href="/administrator-manifest.webmanifest"><link rel="icon" href="/administrator-icon.svg" type="image/svg+xml">
<style>
:root{--g:#f4c65e;--g2:#ffe39a;--bg:#080706;--muted:#c0b5a3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#523315 0,#17100a 40%,#080706 80%);color:#fff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;min-height:100vh;padding-bottom:25px}.brand{text-align:center;padding:20px 12px 17px}.crown{font-size:42px;color:var(--g2);line-height:1}.brand h1{font: bold 43px Georgia,serif;letter-spacing:3px;color:var(--g2);margin:0;text-shadow:0 2px 18px #c17c21}.brand p{font-size:11px;letter-spacing:5px;margin:0;color:#fff0c9}.brand small{display:block;color:var(--g2);font:italic 15px Georgia;margin-top:10px}.wrap{max-width:680px;margin:auto;padding:0 13px}.profile,.section,.order,.login{background:linear-gradient(120deg,#291b10,#110d09 80%);border:1px solid #8a642c;border-radius:22px;box-shadow:0 8px 26px #0009}.profile{display:flex;align-items:center;gap:13px;padding:14px;margin-bottom:16px}.avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--g);display:grid;place-items:center;font-size:34px;background:linear-gradient(140deg,#59401c,#17100a)}.profile b{font-size:17px}.profile small{display:block;color:var(--muted);margin-top:4px}.online{color:#53e46c;font-size:13px;margin-top:5px}.section{padding:15px;margin:13px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title h2{font-size:18px;margin:0}.count{background:#d32335;color:white;border-radius:22px;padding:3px 9px;font-weight:800}.order{padding:13px;margin:10px 0;border-radius:17px;background:linear-gradient(120deg,#281b10,#100c09)}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.oid{font-weight:800;font-size:16px;color:var(--g2)}.time{font-size:12px;color:#c7bba9;white-space:nowrap}.waiter{display:inline-flex;margin:10px 0 5px;padding:6px 10px;border-radius:20px;background:#4b3518;border:1px solid #987035;color:#ffe19a;font-weight:800;font-size:13px}.items{font-size:14px;line-height:1.6;color:#e4ddd2;margin:6px 0 10px}.status{border-radius:20px;padding:5px 9px;font-size:11px;font-weight:800;background:#6c2027;color:white}.status.accepted{background:#174e8b}.status.served{background:#95500b}.status.paid{background:#1c642b}.btn{border:1px solid #f5d47f;background:linear-gradient(110deg,#ffe18d,#d58e20);color:#201405;border-radius:13px;padding:12px 15px;font-weight:800;font-size:14px;cursor:pointer}.wide{width:100%}.empty{text-align:center;color:var(--muted);padding:24px 8px}.login{max-width:420px;margin:25px auto;padding:20px}.input{width:100%;padding:15px;border:1px solid #8a642c;background:#0b0907;color:white;border-radius:12px;margin:10px 0;font-size:16px}.hint{font-size:12px;color:var(--muted)}.sound{width:100%;margin-bottom:12px;background:#24190e;color:var(--g2);border:1px solid #987035}
</style></head><body>
<header class="brand"><div class="crown">♛</div><h1>ORZU</h1><p>R E S T O R A N I</p><small>Bizning maqsad — sizning mamnunligingiz!</small></header>
<main class="wrap"><section class="login" id="login"><h2 style="color:var(--g2);margin:0">Administrator kirishi</h2><p class="hint">Administrator uchun alohida parol</p><input class="input" id="pass" type="password" placeholder="Parolni kiriting"><button class="btn wide" onclick="signIn()">Kirish</button><p id="err" class="hint"></p></section>
<section id="dashboard" hidden><div class="profile"><div class="avatar">♛</div><div><b>ORZU Administrator</b><small>Barcha buyurtmalar nazorati</small><div class="online">● Onlayn</div></div></div><button class="btn sound" onclick="enableAlerts()">🔔 Ovozli xabarni yoqish</button><section class="section"><div class="section-title"><h2>🔔 Yangi buyurtmalar</h2><span class="count" id="newCount">0</span></div><div id="newOrders"></div></section><section class="section"><div class="section-title"><h2>☷ Barcha buyurtmalar</h2><span class="hint" id="allCount">0 ta</span></div><div id="orders"></div></section><button class="btn wide" onclick="logout()">Chiqish</button></section></main>
<script>
let key=localStorage.getItem('orzu_administrator_key')||'',known=null,busy=false,soundContext=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusName={new:'Yangi buyurtma',accepted:'Qabul qilindi',served:'Tayyorlanmoqda',paid:'Yakunlandi'};
function unlockSound(){try{soundContext=soundContext||new AudioContext();soundContext.resume()}catch(e){}}
function enableAlerts(){unlockSound();if('Notification'in window)Notification.requestPermission();alert('Ovoz yoqildi. Sahifa ochiq turganda yangi zakaz haqida xabar beradi.')}
function signIn(){unlockSound();key=pass.value.trim();if(!key)return;localStorage.setItem('orzu_administrator_key',key);refresh()}
function logout(){localStorage.removeItem('orzu_administrator_key');key='';dashboard.hidden=true;login.hidden=false}
async function refresh(){if(!key||busy)return;busy=true;try{const r=await fetch('/api/administrator/data',{headers:{'x-administrator':key}});const d=await r.json();if(!r.ok){err.textContent=d.error==='auth'?'Parol noto‘g‘ri':'Administrator paroli sozlanmagan';logout();return}render(d)}catch(e){err.textContent='Server bilan aloqa uzildi'}finally{busy=false}}
function card(o){return '<article class="order"><div class="top"><span class="oid">#'+esc(o.id)+' · Stol '+esc(o.table)+'</span><span class="time">'+(o.time?new Date(o.time).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}):'')+'</span></div><div class="waiter">👤 MAS’UL OFITSIANT: '+esc(o.waiterName||'Noma’lum')+'</div><div class="items">'+(o.items||[]).map(i=>esc(i.name)+' × '+esc(i.qty)).join('<br>')+'</div><div class="bottom"><span class="status '+esc(o.status)+'">'+esc(statusName[o.status]||o.status)+'</span><span class="time">'+(o.time?new Date(o.time).toLocaleDateString('uz-UZ'):'')+'</span></div></article>'}
function playAlert(o){try{unlockSound();[880,1175,880].forEach((hz,i)=>{const osc=soundContext.createOscillator(),g=soundContext.createGain();g.gain.value=.15;osc.frequency.value=hz;osc.connect(g);g.connect(soundContext.destination);osc.start(soundContext.currentTime+i*.22);osc.stop(soundContext.currentTime+i*.22+.17)});navigator.vibrate&&navigator.vibrate([250,100,250]);if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance('Yangi buyurtma. Stol '+o.table+'. Ofitsiant '+(o.waiterName||'noma’lum'));u.lang='uz-UZ';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}}catch(e){}if('Notification'in window&&Notification.permission==='granted')new Notification('ORZU — yangi buyurtma',{body:'Stol '+o.table+' · Ofitsiant: '+(o.waiterName||'noma’lum'),icon:'/administrator-icon.svg'})}
function render(d){login.hidden=true;dashboard.hidden=false;const all=(d.orders||[]).slice().sort((a,b)=>b.time-a.time),fresh=all.filter(o=>o.status==='new');newCount.textContent=fresh.length;allCount.textContent=all.length+' ta';newOrders.innerHTML=fresh.map(card).join('')||'<div class="empty">Yangi buyurtmalar yo‘q</div>';orders.innerHTML=all.map(card).join('')||'<div class="empty">Hozircha buyurtmalar yo‘q</div>';if(known){const incoming=fresh.filter(o=>!known.has(String(o.id)));incoming.forEach(playAlert)}known=new Set(all.map(o=>String(o.id)))}
pass.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});if(key)refresh();else login.hidden=false;setInterval(refresh,3500);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/admin-sw.js').catch(()=>{}));
</script></body></html>
