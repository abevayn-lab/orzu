<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ORZU — Admin</title><meta name="theme-color" content="#111014"><link rel="manifest" href="/admin-manifest.webmanifest"><link rel="icon" href="/admin-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body>
<div class="hero" style="padding:20px"><h1 class="gold" style="font-size:36px">ORZU</h1><p>ADMIN</p></div>
<div class="tabs" id="tb"></div><div class="wrap" id="app"></div><nav id="bottomNav" aria-label="Admin menyu"></nav>
<script>
let P=localStorage.ap||'',D,tab=0,img='',edit=null,knownOrderIds=null;
function alertNewOrders(list){const fresh=list.filter(o=>o.status==='new'&&knownOrderIds&&!knownOrderIds.has(o.id));if(fresh.length){try{const a=window.__orzuAudio||(window.__orzuAudio=new AudioContext());if(a.state==='suspended')a.resume();const now=a.currentTime;[1046,1318].forEach((hz,i)=>{const o=a.createOscillator(),g=a.createGain(),t=now+i*.16;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.72,t+.02);g.gain.setValueAtTime(.66,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.4)});navigator.vibrate&&navigator.vibrate([180,70,180])}catch(e){}if('Notification'in window&&Notification.permission==='granted'){fresh.forEach(o=>new Notification('ORZU — Yangi buyurtma',{body:'Stol '+o.table+' · Ofitsiant: '+o.waiterName,icon:'/admin-icon.svg'}))}}knownOrderIds=new Set(list.map(o=>o.id))}
async function enableNotifications(){try{window.__orzuAudio=new AudioContext();await window.__orzuAudio.resume()}catch(e){}if(!('Notification'in window))return alert('Bu brauzer bildirishnomani qo‘llamaydi');const p=await Notification.requestPermission();alert(p==='granted'?'Bildirishnomalar yoqildi!':'Bildirishnomaga ruxsat berilmadi')}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/admin-sw.js').catch(()=>{}));
const f=n=>Number(n||0).toLocaleString('ru')+" so'm",TABS=['Bosh sahifa','Buyurtmalar','Menyu','Ofitsiantlar','To‘liq statistika','Bo‘limlar'];
const H=()=>({'Content-Type':'application/json','x-admin':P});
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:H(),body:b?JSON.stringify(b):undefined});if(r.status==401){localStorage.removeItem('ap');P='';login();throw 0}return r.json()}
function login(){tb.innerHTML='';app.innerHTML=`<div class="stat" style="max-width:380px;margin:auto"><h2 class="gold">Kirish</h2><input id="pw" type="password" placeholder="Parol"><button class="btn" style="width:100%;margin-top:8px" onclick="P=pw.value;localStorage.ap=P;load()">Kirish</button></div>`}
async function load(){if(!P)return login();D=await api('/api/admin/data');alertNewOrders(D.orders);render()}
function render(){const nav=[['⌂','Bosh sahifa',0],['▣','Keyingisi',1],['＋','Menyu',2],['♙','Ofitsiant',3],['▤','Statistika',4]];bottomNav.innerHTML=nav.map(x=>'<button class="navitem '+(tab===x[2]?'active':'')+'" onclick="tab='+x[2]+';render()"><b>'+x[0]+'</b><span>'+x[1]+'</span></button>').join('');app.innerHTML=[home,orders,menu,waiters,stats,categories][tab]()}
const grp=(a,k)=>{const m={};a.forEach(o=>{const x=m[k(o)]||(m[k(o)]={n:0,s:0});x.n++;x.s+=o.total});return Object.entries(m).sort((a,b)=>b[1].s-a[1].s)};
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
function home(){
const all=D.history||D.orders||[],since=Number(D.statsResetAt||0),paid=all.filter(o=>Number(o.time||0)>=since&&o.status==='paid'),sum=paid.reduce((n,o)=>n+Number(o.total||0),0),fresh=(D.orders||[]).filter(o=>o.status==='new').length;
return '<div class="profilebar"><div class="profilebadge">♛</div><div><b>ORZU ADMIN</b><small>Restoran boshqaruvi</small><span>● Onlayn</span></div></div><div class="home-stats"><div class="home-stat"><span>To‘langan buyurtma</span><b>'+paid.length+'</b></div><div class="home-stat"><span>Jami savdo</span><b>'+f(sum)+'</b></div><div class="home-stat"><span>Yangi buyurtma</span><b>'+fresh+'</b></div></div><button class="home-action" onclick="tab=1;render()">▣　Buyurtmalarni ko‘rish　'+fresh+'　›</button><div class="stat"><h3 class="gold">Tezkor bo‘limlar</h3><div class="quick-grid"><button class="btn" onclick="tab=2;render()">＋ Menyu qo‘shish</button><button class="btn" onclick="tab=3;render()">＋ Ofitsiant qo‘shish</button><button class="btn" onclick="tab=4;render()">▤ To‘liq statistika</button></div></div>';
}
function stats(){
const since=Number(D.statsResetAt||0),O=(D.history||D.orders||[]).filter(o=>Number(o.time||0)>=since&&o.status==='paid'),S=O.reduce((n,o)=>n+Number(o.total||0),0),today=O.filter(o=>new Date(o.time).toDateString()===new Date().toDateString()).reduce((n,o)=>n+Number(o.total||0),0),dishes={};
O.forEach(o=>(o.items||[]).forEach(i=>{const x=dishes[i.name]||(dishes[i.name]={qty:0,sum:0});x.qty+=Number(i.qty||0);x.sum+=Number(i.qty||0)*Number(i.price||0)}));
const dishRows=Object.entries(dishes).sort((a,b)=>b[1].qty-a[1].qty).map(x=>[x[0],x[1].qty,f(x[1].sum)]);
return '<div class="stat"><h2 class="gold">To‘liq statistika</h2><p class="muted">Faqat kassada to‘langan buyurtmalar hisoblanadi.</p><div class="home-stats"><div class="home-stat"><span>Jami savdo</span><b>'+f(S)+'</b></div><div class="home-stat"><span>Bugungi savdo</span><b>'+f(today)+'</b></div><div class="home-stat"><span>To‘langan buyurtma</span><b>'+O.length+'</b></div></div><p>O‘rtacha chek: <b class="gold">'+f(O.length?Math.round(S/O.length):0)+'</b></p></div><h3 class="gold sp">Ofitsiantlar bo‘yicha savdo</h3><div class="stat sp" style="overflow:auto">'+tbl(['Ofitsiant','Buyurtma','Savdo summasi'],grp(O,o=>o.waiterName||'Noma’lum').map(x=>[x[0],x[1].n,f(x[1].s)]))+'</div><h3 class="gold sp">Taomlar bo‘yicha savdo</h3><div class="stat sp" style="overflow:auto">'+tbl(['Taom nomi','Sotilgan soni','Jami summa'],dishRows)+'</div><div class="stat sp"><b>Statistikani noldan boshlash</b><p class="muted">Eski buyurtmalar tarixi saqlanadi. Faqat statistika hisoblagichi yangidan boshlanadi.</p><button class="btn red" style="width:100%" onclick="clearStats()">Statistikani tozalash</button></div>';
}
async function clearStats(){if(!confirm('Statistika noldan boshlansinmi? Eski buyurtmalar tarixi saqlanadi.'))return;const r=await api('/api/admin/reset-stats','POST',{});if(r.error)return alert(r.error);await load();alert('Statistika noldan boshlandi. Buyurtmalar tarixi saqlandi.')}
function menu(){return `<div class="stat"><button class="btn sm" onclick="tab=5;render()">Bo‘limlarni boshqarish</button><h3 class="gold">${edit?'Taomni tahrirlash':"Taom qo'shish"}</h3><input id="mn" placeholder="Nomi" value="${edit?edit.name:''}"><input id="mp" type="number" placeholder="Narxi (so'm)" value="${edit?edit.price:''}"><select id="mc">${D.cats.map((c,i)=>`<option value="${i}" ${edit&&edit.cat==i?'selected':''}>${c}</option>`).join('')}</select><input type="file" accept="image/*" onchange="pick(this)"><div class="row sp"><button class="btn" onclick="saveM()">Saqlash</button>${edit?'<button class="btn red" onclick="edit=null;img=\'\';render()">Bekor</button>':''}</div></div>
<div class="stat sp" style="overflow:auto">${tbl(['Rasm','Nomi','Narx','Bo‘lim',''],D.menu.map(m=>[`<img class="thumb" src="${m.img}">`,m.name,f(m.price),D.cats[m.cat],`<button class="btn sm" onclick="ed(${m.id})">✎</button> <button class="btn sm red" onclick="delM(${m.id})">✕</button>`]))}</div>`}
function pick(el){const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,700/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.8)};i.src=e.target.result};r.readAsDataURL(el.files[0])}
async function saveM(){if(!mn.value||!mp.value)return alert('Nom va narxni kiriting');await api('/api/admin/menu','POST',{id:edit&&edit.id,name:mn.value,price:mp.value,cat:mc.value,img});edit=null;img='';load()}
function ed(id){edit=D.menu.find(m=>m.id==id);render();scrollTo(0,0)}
async function delM(id){if(confirm("O'chirilsinmi?")){await api('/api/admin/menu/'+id,'DELETE');load()}}
function categories(){return `<div class="stat"><h3 class="gold">Yangi menyu bo‘limi qo‘shish</h3><p style="color:#b9a875;margin:8px 0 12px">Masalan: Ichimliklar, Desertlar, Milliy taomlar. Bo‘lim qo‘shilgach, u mijozlar menyusida ham chiqadi.</p><input id="cn" maxlength="40" placeholder="Yangi bo‘lim nomi"><button class="btn" style="margin-top:8px" onclick="addCategory()">+ Bo‘lim qo‘shish</button></div><div class="stat sp"><h3 class="gold">Mavjud bo‘limlar</h3><p style="color:#b9a875;margin:8px 0 12px">Keraksiz bo‘limni o‘chirishingiz mumkin. Undagi taomlar boshqa bo‘limga ko‘chiriladi.</p><div style="display:grid;gap:10px">${D.cats.map((x,i)=>`<div class="row" style="align-items:center;justify-content:space-between;gap:12px"><span>${i+1}. ${x}</span><button class="btn sm red" onclick="removeCategory(${i})">O‘chirish</button></div>`).join('')}</div></div>`}
async function addCategory(){const name=cn.value.trim();if(!name)return alert('Bo‘lim nomini yozing');const r=await api('/api/admin/category','POST',{name});if(r.error)return alert(r.error);cn.value='';await load();alert('Yangi bo‘lim qo‘shildi!')}
async function removeCategory(i){const name=D.cats[i];if(!confirm('"'+name+'" bo‘limi o‘chirilsinmi? Undagi taomlar boshqa bo‘limga ko‘chiriladi.'))return;const r=await api('/api/admin/category/'+i,'DELETE');if(r.error)return alert(r.error);await load();alert('Bo‘lim o‘chirildi!')}
function waiters(){return `<div class="stat"><h3 class="gold">Ofitsiant qo'shish</h3><input id="wn" placeholder="Ism"><input id="wp" placeholder="PIN kod (masalan 1234)"><button class="btn" onclick="addW()">Qo'shish</button></div><div class="stat sp">${tbl(['Ism','PIN',''],D.waiters.map(w=>[w.name,w.pin,`<button class="btn sm red" onclick="delW(${w.id})">✕</button>`]))}</div>`}
async function addW(){if(!wn.value||!wp.value)return;await api('/api/admin/waiter','POST',{name:wn.value,pin:wp.value});load()}
async function delW(id){if(confirm("O'chirilsinmi?")){await api('/api/admin/waiter/'+id,'DELETE');load()}}
function orders(){return `<div class="stat"><button class="btn" style="width:100%;margin-bottom:10px" onclick="enableNotifications()">🔔 Bildirishnomalarni yoqish</button><p style="color:#b9a875">Yangi buyurtmalar avtomatik yangilanadi. Bildirishnoma olish uchun shu sahifaga ruxsat bering.</p></div><div class="stat" style="overflow:auto">${tbl(['#','Stol','Ofitsiant','Summa','Holat','Vaqt'],D.orders.slice(-60).reverse().map(o=>[o.id,o.table,o.waiterName,f(o.total),`<span class="badge ${o.status}">${o.status}</span>`,new Date(o.time).toLocaleString('ru')]))}</div>`}
load();setInterval(()=>{if(P)load().catch(()=>{})},5000);
</script><style>
#bottomNav{position:fixed;z-index:10000;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#100c09f7;border-top:1px solid #956b31;backdrop-filter:blur(12px)}#bottomNav .navitem{min-width:0;border:0;background:transparent;color:#c8b99f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 2px;font-size:10px;font-weight:700}#bottomNav .navitem b{font-size:20px;line-height:1;color:#e5bd6d}#bottomNav .navitem.active{color:#ffe39a}#bottomNav .navitem.active b{color:#ffe39a;text-shadow:0 0 12px #e8b94b}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.muted{color:#c5b79e;font-size:13px;line-height:1.5}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior-y:contain}
button,a,input,select,textarea{touch-action:manipulation}
#orzu-exit-layer{position:fixed;inset:0;z-index:999999;background:#050403df;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(7px)}
#orzu-exit-box{width:min(100%,340px);padding:25px 20px;border:1px solid #a77a32;border-radius:22px;background:linear-gradient(145deg,#2b1d10,#100c08);box-shadow:0 15px 50px #000b;text-align:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
#orzu-exit-box .crown{font-size:34px;color:#ffdc8a}#orzu-exit-box h2{font-size:20px;margin:8px 0;color:#ffe39a}#orzu-exit-box p{color:#d4c7b2;font-size:14px;margin:0 0 20px}
#orzu-exit-actions{display:flex;gap:10px}#orzu-exit-actions button{flex:1;padding:13px 10px;border-radius:12px;font-weight:800;font-size:15px;border:1px solid #a77a32}
#orzu-stay{background:#21170f;color:#ffe39a}#orzu-leave{background:linear-gradient(110deg,#ffe18d,#d58e20);color:#201405}
</style>
<div id="orzu-exit-layer" role="dialog" aria-modal="true" aria-labelledby="orzu-exit-title"><div id="orzu-exit-box"><div class="crown">♛</div><h2 id="orzu-exit-title">Ilovadan chiqmoqchimisiz?</h2><p>Chiqishni tasdiqlaysizmi?</p><div id="orzu-exit-actions"><button id="orzu-stay" type="button">Yo‘q, qolaman</button><button id="orzu-leave" type="button">Ha, chiqaman</button></div></div></div>
<script>
(function(){
 const layer=document.getElementById('orzu-exit-layer'),stay=document.getElementById('orzu-stay'),leave=document.getElementById('orzu-leave');
 let allowExit=false,waiting=false;
 function arm(){try{history.pushState({orzuGuard:true},'',location.href)}catch(e){}}
 function ask(){if(waiting)return;waiting=true;layer.style.display='flex';stay.focus()}
 stay.addEventListener('click',()=>{layer.style.display='none';waiting=false;arm()});
 leave.addEventListener('click',()=>{
   allowExit=true;layer.style.display='none';waiting=false;
   const from=location.pathname;
   try{history.go(-2)}catch(e){}
   setTimeout(()=>{
     if(location.pathname===from){
       if(from!=='/') location.assign('/');
       else {allowExit=false;arm();alert('Ilovadan chiqish uchun brauzer oynasini yoping.')}
     }
   },450);
 });
 window.addEventListener('popstate',()=>{
   if(allowExit)return;
   ask();arm();
 });
 arm();
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
})();
</script><style id="orzu-reference-design">
:root{--g:#f4c65e;--g2:#ffe39a}
body{background:radial-gradient(ellipse at 50% -18%,#5a3718 0,#21150c 32%,#080706 76%) fixed!important;color:#fff!important;padding-bottom:100px!important;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif!important}
.hero{padding:24px 12px 18px!important}
.hero:before{content:"♛";display:block;color:#ffe39a;font-size:46px;line-height:1.1;text-shadow:0 0 20px #d99b36}
.hero h1{font-size:clamp(43px,12vw,54px)!important;color:#ffda83!important;text-shadow:0 2px 20px #c17c21;letter-spacing:3px!important}
.hero p{letter-spacing:5px!important;color:#fff0c9!important}
.tabs{display:none!important}
.wrap{max-width:650px!important;padding:12px 13px 25px!important}
.stat,.card{background:linear-gradient(125deg,#2b1c10,#17100b 60%,#100c09)!important;border:1px solid #956b31!important;box-shadow:0 8px 25px #0009,inset 0 1px #ffffff0a!important;border-radius:20px!important}
.profilebar{display:flex;align-items:center;gap:13px;padding:14px;margin:0 0 14px;border-radius:22px;border:1px solid #956b31;background:linear-gradient(125deg,#2b1c10,#100c09);box-shadow:0 8px 25px #0009}
.profilebadge{width:64px;height:64px;border:2px solid #d8a84b;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#ffe39a;background:#25190e}
.profilebar b,.profilebar small,.profilebar span{display:block}.profilebar b{font-size:16px}.profilebar small{color:#c0b5a3;margin:4px 0}.profilebar span{color:#54e56c;font-size:12px}
.home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}
.home-stat{min-width:0;padding:14px 7px;text-align:center;border:1px solid #956b31;border-radius:19px;background:linear-gradient(125deg,#2b1c10,#100c09);box-shadow:0 6px 18px #0008}
.home-stat span{display:block;color:#eee;font-size:12px;min-height:30px}.home-stat b{display:block;color:#ffe39a;font:700 clamp(18px,5vw,24px) Georgia,serif;overflow-wrap:anywhere;margin-top:5px}
.home-action{width:100%;border:0;border-radius:30px;padding:17px 12px;margin:5px 0 18px;background:linear-gradient(110deg,#ffe58d,#f6bd42 55%,#bd7a17);color:#241606;font-weight:900;font-size:17px;box-shadow:0 5px 22px #bd7c1d55}
.btn{border-radius:30px!important}
.bar{transform:none!important;bottom:0!important;background:#100c09f5!important;border-top:1px solid #956b31!important;padding:10px!important}
@media(max-width:480px){.home-stats{gap:7px}.home-stat{padding:12px 5px}.home-stat span{font-size:11px}}
</style>
</body></html>
